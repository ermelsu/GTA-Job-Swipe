<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel — GTA Job Swipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body{display:block; padding-bottom:40px}
    .wrap{max-width:1100px; margin:0 auto; padding:0 16px}
    .top{position:sticky; top:0; z-index:10; background:rgba(11,14,20,.92); backdrop-filter:blur(8px);
      border-bottom:1px solid var(--line); padding:16px; text-align:center}
    .top .logo{font-size:.95rem; font-weight:900; letter-spacing:2px; color:var(--accent); text-transform:uppercase}
    .top h1{font-size:1.5rem; font-weight:900; font-style:italic; text-transform:uppercase; margin:4px 0 0}
    .tabs{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:14px 0}
    .tabs button{padding:9px 16px; border-radius:99px; border:1px solid var(--line); background:var(--card);
      color:var(--muted); font-weight:700; font-size:.85rem; cursor:pointer}
    .tabs button.on{background:var(--accent); color:#000; border-color:var(--accent)}
    .sec{display:none} .sec.on{display:block}
    .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:16px 0}
    .stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; text-align:center}
    .stat[data-goto]{cursor:pointer; transition:border-color .15s, transform .1s}
    .stat[data-goto]:hover{border-color:var(--accent)}
    .stat[data-goto]:active{transform:scale(.98)}
    .stat b{display:block; font-size:2rem; font-weight:900; color:var(--accent)}
    .stat span{color:var(--muted); font-size:.85rem; text-transform:uppercase; letter-spacing:.5px}
    .bar-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:8px 0 18px}
    .bar-actions button{padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--txt); cursor:pointer; font-weight:700}
    .muted{color:var(--muted)}
    /* ranking */
    .rank-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line)}
    .rank-pos{width:28px; text-align:center; font-weight:900; color:var(--muted)}
    .rank-thumb{width:96px; aspect-ratio:16/9; object-fit:cover; border-radius:8px; flex:none; background:#21262d}
    .rank-info{flex:1; min-width:0}
    .rank-info b{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .rank-bar{height:6px; background:var(--card); border-radius:99px; overflow:hidden; margin-top:5px}
    .rank-bar i{display:block; height:100%; background:var(--like)}
    .rank-nums{display:flex; gap:12px; font-size:.85rem; white-space:nowrap; font-variant-numeric:tabular-nums}
    .like{color:var(--like); font-weight:800} .dislike{color:var(--dislike)}
    /* pessoas / listas */
    .person{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px}
    .person-head{display:flex; align-items:center; gap:12px; margin-bottom:12px}
    .pav{width:42px; height:42px; border-radius:50%; display:grid; place-items:center; font-weight:900; color:#fff; flex:none}
    .person-head .pn{font-weight:800; font-size:1.05rem}
    .person-head .pc{color:var(--muted); font-size:.82rem}
    .chips{display:flex; gap:8px; flex-wrap:wrap; margin-left:auto}
    .chip{font-size:.78rem; font-weight:700; padding:3px 10px; border-radius:99px; background:var(--bg); border:1px solid var(--line)}
    .thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px}
    .th{border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--card)}
    .th img{width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#21262d}
    .th span{display:block; padding:6px 8px; font-size:.72rem; font-weight:600; line-height:1.2;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .lbl{font-weight:700; font-size:.85rem; margin-bottom:8px}
    .pl-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px}
    .pl-head{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; cursor:pointer; user-select:none}
    .pl-head b{font-size:1.15rem; font-weight:900}
    .pl-head .by{color:var(--muted); font-size:.85rem}
    .pl-head .cnt{margin-left:auto; color:var(--accent); font-weight:800; font-size:.85rem}
    .pl-chev{color:var(--muted); font-size:.85rem; transition:transform .15s; flex:none}
    .pl-card:not(.collapsed) .pl-chev{transform:rotate(90deg)}
    .pl-card.collapsed .pl-head{margin-bottom:0}
    .pl-card.collapsed .pl-body{display:none}
    /* playlists — visão pra copiar nome e colar no GTA */
    .race-row{display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid var(--line)}
    .race-row:last-child{border-bottom:0}
    .race-info{flex:1; min-width:0}
    .race-name{font-size:1.3rem; font-weight:800; line-height:1.2; word-break:break-word}
    .race-meta{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}
    .race-meta span{font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:99px}
    .race-meta .cat{text-transform:uppercase; letter-spacing:.4px; color:var(--muted);
      background:var(--bg); border:1px solid var(--line)}
    .race-meta .rk{font-weight:800; color:#000; background:var(--accent)}
    .race-meta .cm{color:var(--muted); background:var(--bg); border:1px solid var(--line)}
    .copybtn{flex:none; border:1px solid var(--accent); background:transparent; color:var(--accent);
      border-radius:10px; padding:11px 16px; font-weight:800; font-size:.92rem; cursor:pointer; white-space:nowrap}
    .copybtn:hover{background:var(--accent); color:#000}
    .copybtn.done{background:var(--like); border-color:var(--like); color:#000}
    .empty{padding:50px 20px; text-align:center; color:var(--muted)}
    /* botão RUN + modal do script */
    .runbtn{margin-left:12px; flex:none; border:1px solid var(--accent); background:transparent; color:var(--accent);
      border-radius:8px; padding:8px 14px; font-weight:800; font-size:.85rem; cursor:pointer}
    .runbtn:hover{background:var(--accent); color:#000}
    .runmodal{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:16px}
    .runmodal[hidden]{display:none}
    .runbg{position:absolute; inset:0; background:rgba(0,0,0,.66)}
    .runpanel{position:relative; width:min(720px,100%); max-height:90vh; overflow:auto; background:var(--bg2);
      border:1px solid var(--line); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:14px}
    .runpanel h3{margin:0; font-size:1.2rem}
    .run-head{display:flex; align-items:center; justify-content:space-between; gap:10px}
    .run-list{display:flex; flex-direction:column; gap:8px; max-height:54vh; overflow:auto}
    .run-row{display:flex; align-items:center; gap:12px; padding:11px 12px; border:1px solid var(--line);
      border-radius:10px; background:var(--card); color:var(--txt); text-decoration:none}
    .run-row:hover{border-color:var(--accent)}
    .run-row.done{opacity:.55}
    .run-tick{width:20px; text-align:center; font-weight:900; color:var(--muted)}
    .run-row.done .run-tick{color:var(--like)}
    .run-num{width:24px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; flex:none}
    .run-info{flex:1; min-width:0; display:flex; flex-direction:column}
    .run-name{font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .run-cat{font-size:.75rem; color:var(--muted)}
    .run-open{flex:none; color:var(--accent); font-weight:800; font-size:.85rem}
    .runactions{display:flex; gap:10px; flex-wrap:wrap}
    #status{padding:40px 20px; text-align:center}
    .gate{max-width:360px; margin:60px auto; text-align:center; display:flex; flex-direction:column; gap:12px}
    .gate[hidden]{display:none}
    .gate input{padding:14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--txt); text-align:center}
  </style>
</head>
<body>
  <div class="top">
    <div class="logo">GTA Job Swipe</div>
    <h1>Painel do Admin</h1>
  </div>

  <div id="gate" class="gate" hidden>
    <p class="muted">Área restrita. Faça login pra ver o painel.</p>
    <input id="gate-user" type="text" placeholder="usuário" autocomplete="username" autocapitalize="none">
    <input id="gate-pass" type="password" placeholder="senha" autocomplete="current-password">
    <button class="btn-primary" onclick="checkLogin()">Entrar</button>
    <p id="gate-msg" class="dislike"></p>
  </div>

  <div class="wrap" id="app" hidden>
    <div class="tabs">
      <button data-sec="resumo" class="on">Resumo</button>
      <button data-sec="ranking">Ranking</button>
      <button data-sec="pessoas">Pessoas</button>
      <button data-sec="listas">Playlists</button>
    </div>
    <div class="bar-actions">
      <button onclick="location.href='index.html'">🎴 Voltar ao app</button>
      <button onclick="load()">↻ Atualizar</button>
      <button onclick="exportCSV()">Baixar CSV (ranking)</button>
      <button onclick="wipeAll()" style="border-color:var(--dislike); color:var(--dislike)">🗑 Zerar tudo</button>
      <button onclick="adminLogout()">🚪 Sair</button>
      <span id="updated" class="muted"></span>
    </div>

    <div id="sec-resumo" class="sec on"></div>
    <div id="sec-ranking" class="sec"></div>
    <div id="sec-pessoas" class="sec"></div>
    <div id="sec-listas" class="sec"></div>
  </div>

  <!-- modal do RUN: checklist de corridas pra abrir e dar Bookmark Job -->
  <div id="runmodal" class="runmodal" hidden>
    <div class="runbg" onclick="closeRun()"></div>
    <div class="runpanel">
      <h3 id="run-title">▶ Bookmark</h3>
      <p class="muted" style="margin:0; font-size:.9rem">Esteja <b>logado</b> no site da Rockstar (mesma conta do jogo). Clique em cada corrida pra abrir e aperte <b>Bookmark Job</b>. O ✓ marca as que você já abriu (salvo neste navegador). No jogo: menu <b>Bookmarked</b>.</p>
      <div class="run-head">
        <span id="run-prog" class="muted"></span>
        <button class="btn-ghost" style="padding:6px 12px" onclick="resetRunTicks()">Limpar ✓</button>
      </div>
      <div id="run-list" class="run-list"></div>
      <div class="runactions">
        <button class="btn-ghost" onclick="closeRun()">Fechar</button>
      </div>
    </div>
  </div>

  <div id="status">Carregando…</div>

  <script src="config.js"></script>
  <script>
  const CFG = window.CONFIG || {};
  const KEY = CFG.SUPABASE_ANON_KEY;
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const TYPE_PT = {
    LandRace:"Corrida de terra", AirRace:"Corrida aérea", WaterRace:"Corrida aquática",
    BikeRace:"Corrida de moto", StreetRace:"Corrida de rua", StuntRace:"Corrida acrobática",
    DragRace:"Arrancada", DriftRace:"Corrida de drift", PursuitRace:"Corrida de perseguição",
    SpecialRace:"Corrida especial", ArcadeRace:"Corrida arcade",
    Deathmatch:"Mata-mata", TeamDeathmatch:"Mata-mata em equipe",
    VehicleDeathmatch:"Mata-mata de veículos", ArenaDeathmatch:"Mata-mata na Arena",
    Capture:"Captura", LastTeamStanding:"Última equipe de pé",
    KingOfTheHill:"Rei da montanha", TeamKingOfTheHill:"Rei da montanha em equipe",
    Parachuting:"Paraquedismo", AdversaryMode:"Modo Confronto", ArenaWar:"Arena War",
    MissionCreator:"Missão",
  };
  const prettyType = t => { if(!t) return ""; const b=t.replace(/P2P$/,""); return TYPE_PT[b] || b.replace(/([a-z])([A-Z])/g,"$1 $2").trim(); };
  const color = s => { let h=0; for(const c of (s||"?")) h=(h*31+c.charCodeAt(0))>>>0; return `hsl(${h%360} 62% 46%)`; };
  let jobById = {}, rankRows = [], peopleById = {}, allLists = [];

  // ------- acesso restrito por LOGIN + SENHA (1 usuário) -------
  const NS = "r2";   // mesmo namespace do app.js
  const ADMIN_USER = "Emerson";
  // SHA-256 da senha (a senha em si não fica no código).
  const ADMIN_HASH = "d8aeee93382d061f6ed9ef73caeee79c0f0441e2cc3f560cc15375255dd491ca";
  async function sha256(s){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  async function checkLogin(){
    const u = ($("#gate-user").value||"").trim();
    const p = $("#gate-pass").value||"";
    let ok = false;
    if(u.toLowerCase() === ADMIN_USER.toLowerCase()){
      try { ok = (await sha256(p)) === ADMIN_HASH; } catch(e){ ok = false; }
    }
    if(ok){ localStorage.setItem(`gjs_${NS}_admin_ok`,"1"); $("#gate-pass").value=""; start(); }
    else { $("#gate-msg").textContent = "Usuário ou senha inválidos."; $("#gate-pass").value=""; $("#gate-pass").focus(); }
  }
  function adminLogout(){
    localStorage.removeItem(`gjs_${NS}_admin_ok`);
    location.reload();
  }

  async function sb(path){
    const r = await fetch(`${CFG.SUPABASE_URL}/rest/v1/${path}`, { headers:{ apikey:KEY, Authorization:"Bearer "+KEY } });
    if(!r.ok) throw new Error(path+" → "+r.status+" "+await r.text());
    return r.json();
  }

  async function load(){
    $("#status").hidden = false; $("#status").textContent = "Carregando…";
    try{
      const jobs = await fetch("jobs.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>[]);
      jobById = {}; jobs.forEach(j=>jobById[j.id]=j);
      const votes = await sb("votes?select=*&order=created_at.desc&limit=100000");
      let pls = [], plsErr = null;                       // playlists é opcional
      try { pls = await sb("playlists?select=*&limit=100000"); }
      catch(e){ plsErr = e; console.warn("playlists indisponível:", e.message); }
      render(votes, pls, plsErr);
      $("#status").hidden = true; $("#app").hidden = false;
      $("#updated").textContent = "atualizado " + new Date().toLocaleTimeString("pt-BR");
    }catch(e){
      $("#status").hidden=false; $("#app").hidden=true;
      $("#status").innerHTML = "<span class='dislike'>Erro: "+esc(e.message)+"</span><br><br>"+
        "<span class='muted'>Confira se o supabase_setup.sql foi rodado (tabelas votes e playlists) e o config.js.</span>";
    }
  }

  function thumb(jobId){
    const j = jobById[jobId] || {};
    const title = j.title || jobId;
    const img = j.img ? `<img src="${j.img}" alt="" loading="lazy" onerror="this.remove()">` : "";
    return `<div class="th">${img}<span>${esc(title)}</span></div>`;
  }
  function raceRow(jobId){
    const j = jobById[jobId] || {};
    const name = j.title || jobId;
    const cat = prettyType(j.type);
    const origin = j.rockstar ? `<span class="rk">★ Rockstar</span>` : `<span class="cm">Comunidade</span>`;
    return `<div class="race-row">
      <div class="race-info">
        <div class="race-name">${esc(name)}</div>
        <div class="race-meta">${cat ? `<span class="cat">${esc(cat)}</span>` : ""}${origin}</div>
      </div>
      <button class="copybtn" data-copy="${esc(name)}" title="Copiar o nome pra colar no GTA">⧉ Copiar</button>
    </div>`;
  }
  document.addEventListener("click", e=>{
    const b = e.target.closest(".copybtn"); if(!b) return;
    const txt = b.getAttribute("data-copy") || "";
    const done = () => { const old = b.textContent; b.textContent = "✓ Copiado"; b.classList.add("done");
      setTimeout(()=>{ b.textContent = old; b.classList.remove("done"); }, 1200); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(fallbackCopy); }
    else fallbackCopy();
    function fallbackCopy(){
      const t=document.createElement("textarea"); t.value=txt; t.style.position="fixed"; t.style.opacity="0";
      document.body.appendChild(t); t.select(); try{ document.execCommand("copy"); done(); }catch(e){} t.remove();
    }
  });

  function render(votes, pls, plsErr){
    // ----- agrega -----
    const voters = {};   // id -> {name,id,like:[],dislike:[],skip:[],last}
    votes.forEach(v=>{
      const V = voters[v.voter_id] || (voters[v.voter_id] = {name:v.voter_name, id:v.voter_id, like:[], dislike:[], skip:[], last:v.created_at});
      V.name = v.voter_name || V.name;
      if(V[v.vote]) V[v.vote].push(v.job_id);
      if(v.created_at > V.last) V.last = v.created_at;
    });
    pls.forEach(p=>{ if(!voters[p.voter_id]) voters[p.voter_id] = {name:p.voter_name, id:p.voter_id, like:[], dislike:[], skip:[], last:p.updated_at}; });
    peopleById = voters;

    const rank = {};     // job_id -> {like,dislike,skip,vset}
    votes.forEach(v=>{ const R = rank[v.job_id] || (rank[v.job_id]={like:0,dislike:0,skip:0,vset:new Set()}); if(R[v.vote]!=null)R[v.vote]++; R.vset.add(v.voter_id); });
    rankRows = Object.entries(rank).map(([job_id,r])=>({job_id, likes:r.like, dislikes:r.dislike, skips:r.skip, votantes:r.vset.size}))
      .sort((a,b)=> b.likes-a.likes || a.dislikes-b.dislikes);

    const lists = [];    // {owner, name, jobs[]}
    pls.forEach(p=> (p.data||[]).forEach(l=> lists.push({owner:p.voter_name, name:l.name, jobs:l.jobs||[]})));
    allLists = lists;    // pro botão RUN acessar

    const voterArr = Object.values(voters).sort((a,b)=> (b.like.length+b.dislike.length+b.skip.length)-(a.like.length+a.dislike.length+a.skip.length));
    const totalLikes = votes.filter(v=>v.vote==="like").length;

    // ----- RESUMO -----
    $("#sec-resumo").innerHTML = `
      <div class="stats">
        <div class="stat" data-goto="pessoas"><b>${voterArr.length}</b><span>Pessoas</span></div>
        <div class="stat" data-goto="ranking"><b>${votes.length}</b><span>Votos</span></div>
        <div class="stat" data-goto="ranking"><b>${totalLikes}</b><span>Curtidas</span></div>
        <div class="stat" data-goto="listas"><b>${lists.length}</b><span>Playlists</span></div>
      </div>
      <h3 style="margin:18px 0 10px">Quem entrou (mais recentes)</h3>
      ${voterArr.slice().sort((a,b)=> (b.last||"").localeCompare(a.last||"")).slice(0,20).map(v=>`
        <div class="rank-row">
          <span class="pav" style="width:34px;height:34px;background:${color(v.name)}">${esc((v.name||"?")[0]||"?").toUpperCase()}</span>
          <div class="rank-info"><b>${esc(v.name||"Anônimo")}</b>
            <div class="muted" style="font-size:.8rem">${v.last?new Date(v.last).toLocaleString("pt-BR"):""}</div></div>
          <div class="rank-nums"><span class="like">👍 ${v.like.length}</span><span class="dislike">👎 ${v.dislike.length}</span></div>
        </div>`).join("") || "<p class='muted'>Ninguém votou ainda.</p>"}`;

    // ----- RANKING -----
    const maxL = Math.max(1, ...rankRows.map(r=>r.likes));
    $("#sec-ranking").innerHTML = rankRows.length ? rankRows.map((r,i)=>{
      const j = jobById[r.job_id] || {};
      return `<div class="rank-row">
        <span class="rank-pos">${i+1}</span>
        <img class="rank-thumb" src="${j.img||""}" alt="" loading="lazy">
        <div class="rank-info">
          <b>${esc(j.title||r.job_id)}</b>
          <span class="muted" style="font-size:.78rem">${esc(prettyType(j.type))}</span>
          <div class="rank-bar"><i style="width:${r.likes/maxL*100}%"></i></div>
        </div>
        <div class="rank-nums"><span class="like">👍 ${r.likes}</span><span class="dislike">👎 ${r.dislikes}</span><span class="muted">⏭ ${r.skips}</span></div>
      </div>`;
    }).join("") : "<p class='empty'>Sem votos ainda.</p>";

    // ----- PESSOAS -----
    $("#sec-pessoas").innerHTML = voterArr.length ? voterArr.map(v=>`
      <div class="person">
        <div class="person-head">
          <span class="pav" style="background:${color(v.name)}">${esc((v.name||"?")[0]||"?").toUpperCase()}</span>
          <div><div class="pn">${esc(v.name||"Anônimo")}</div>
            <div class="pc">${v.last?("último voto "+new Date(v.last).toLocaleString("pt-BR")):""}</div></div>
          <div class="chips">
            <span class="chip like">👍 ${v.like.length}</span>
            <span class="chip dislike">👎 ${v.dislike.length}</span>
            <span class="chip muted">⏭ ${v.skip.length}</span>
            <button class="chip" style="cursor:pointer; border-color:var(--dislike); color:var(--dislike)" data-del-user="${esc(v.id)}">🗑 Excluir</button>
          </div>
        </div>
        ${v.like.length ? `<div class="lbl like">👍 Curtiu (${v.like.length})</div>
          <div class="thumbs">${v.like.map(thumb).join("")}</div>` : ""}
        ${v.dislike.length ? `<div class="lbl dislike" style="margin-top:14px">👎 Passou (${v.dislike.length})</div>
          <div class="thumbs">${v.dislike.map(thumb).join("")}</div>` : ""}
        ${(!v.like.length && !v.dislike.length) ? `<p class="muted">Ainda sem curtidas ou dislikes.</p>` : ""}
      </div>`).join("") : "<p class='empty'>Ninguém entrou ainda.</p>";

    // ----- LISTAS -----
    if(plsErr){
      $("#sec-listas").innerHTML = `<div class="empty">A tabela <b>playlists</b> ainda não existe no Supabase.<br><br>
        Abra o <b>SQL Editor</b> e rode o bloco de playlists do <code>supabase_setup.sql</code> pra ativar esta aba.</div>`;
      return;
    }
    $("#sec-listas").innerHTML = lists.length ? lists.map((l,idx)=>`
      <div class="pl-card collapsed">
        <div class="pl-head" data-pl-toggle>
          <span class="pl-chev">▶</span>
          <b>🏁 ${esc(l.name||"(sem nome)")}</b>
          <span class="by">por ${esc(l.owner||"Anônimo")}</span>
          <span class="cnt">${l.jobs.length} corrida(s)</span>
          <button class="runbtn" data-run="${idx}" title="Adicionar estas corridas aos Bookmarked da sua conta Rockstar">▶ RUN</button></div>
        <div class="pl-body">
          ${l.jobs.length ? l.jobs.map(raceRow).join("") : `<p class="muted">Lista vazia.</p>`}
        </div>
      </div>`).join("") : "<p class='empty'>Nenhuma playlist criada ainda.</p>";
  }

  // ------- excluir usuário / zerar tudo -------
  async function sbDelete(path){
    const r = await fetch(`${CFG.SUPABASE_URL}/rest/v1/${path}`, {
      method:"DELETE", headers:{ apikey:KEY, Authorization:"Bearer "+KEY, Prefer:"return=minimal" }
    });
    if(!r.ok) throw new Error(path+" → "+r.status+" "+await r.text());
  }
  async function delUser(id){
    const p = peopleById[id]; const name = (p && p.name) || "essa pessoa";
    if(!confirm(`Excluir "${name}" e TODOS os votos e listas dela?\nNão dá pra desfazer.`)) return;
    try{
      await sbDelete(`votes?voter_id=eq.${encodeURIComponent(id)}`);
      await sbDelete(`playlists?voter_id=eq.${encodeURIComponent(id)}`);
      load();
    }catch(e){ alert("Falhou ao excluir: "+e.message+"\n\nRode o supabase_setup.sql atualizado (políticas de DELETE)."); }
  }
  async function wipeAll(){
    if(!confirm("MARCO ZERO: apagar TODOS os votos e TODAS as listas de TODO MUNDO. Tem certeza?")) return;
    if(!confirm("Última confirmação — isso NÃO dá pra desfazer. Zerar tudo?")) return;
    try{
      await sbDelete("votes?voter_id=not.is.null");
      await sbDelete("playlists?voter_id=not.is.null");
      alert("Pronto! Tudo zerado. 🧹");
      load();
    }catch(e){ alert("Falhou ao zerar: "+e.message+"\n\nRode o supabase_setup.sql atualizado (políticas de DELETE)."); }
  }
  document.addEventListener("click", e=>{
    const b = e.target.closest("[data-del-user]");
    if(b) delUser(b.getAttribute("data-del-user"));
  });

  function exportCSV(){
    const head = "job_id,titulo,tipo,likes,dislikes,skips,votantes\n";
    const body = rankRows.map(r=>{ const j=jobById[r.job_id]||{};
      return `${r.job_id},"${(j.title||"").replace(/"/g,'""')}","${prettyType(j.type)}",${r.likes},${r.dislikes},${r.skips},${r.votantes}`; }).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([head+body],{type:"text/csv"})); a.download="ranking.csv"; a.click();
  }

  // tabs
  function goTab(sec){
    document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on", x.dataset.sec===sec));
    document.querySelectorAll(".sec").forEach(s=>s.classList.toggle("on", s.id==="sec-"+sec));
    window.scrollTo(0,0);
  }
  document.querySelectorAll(".tabs button").forEach(b=> b.onclick = ()=> goTab(b.dataset.sec));
  // cards do Resumo levam pra aba; RUN abre o modal; cabeçalho abre/fecha a lista
  document.addEventListener("click", e=>{
    const run = e.target.closest("[data-run]");
    if(run){ e.stopPropagation(); openRun(+run.getAttribute("data-run")); return; }
    const bm = e.target.closest("[data-bm]");
    if(bm){ const id=bm.getAttribute("data-bm"); localStorage.setItem(bmKey(id),"1");
      bm.classList.add("done"); const t=bm.querySelector(".run-tick"); if(t)t.textContent="✓"; updateRunProg(); return; }
    const card = e.target.closest("[data-goto]");
    if(card){ goTab(card.getAttribute("data-goto")); return; }
    const head = e.target.closest("[data-pl-toggle]");
    if(head){ head.closest(".pl-card").classList.toggle("collapsed"); }
  });

  // ------- RUN: checklist de corridas pra abrir e dar Bookmark Job -------
  let runIds = [];
  const bmKey = id => `gjs_${NS}_bm_${id}`;
  const jobUrl = id => "https://socialclub.rockstargames.com/job/gtav/" + id;
  function openRun(idx){
    const l = allLists[idx]; if(!l) return;
    runIds = (l.jobs||[]).filter(Boolean);
    if(!runIds.length){ alert("Essa lista está vazia."); return; }
    $("#run-title").textContent = `▶ Bookmark — "${l.name}"`;
    renderRunList();
    $("#runmodal").hidden = false;
  }
  function renderRunList(){
    $("#run-list").innerHTML = runIds.map((id,i)=>{
      const j = jobById[id] || {};
      const done = localStorage.getItem(bmKey(id))==="1";
      const meta = [prettyType(j.type), j.rockstar?"★ Rockstar":"Comunidade"].filter(Boolean).join(" · ");
      return `<a class="run-row${done?" done":""}" href="${jobUrl(id)}" target="_blank" rel="noopener" data-bm="${esc(id)}">
        <span class="run-tick">${done?"✓":"○"}</span>
        <span class="run-num">${i+1}</span>
        <span class="run-info"><span class="run-name">${esc(j.title||id)}</span><span class="run-cat">${esc(meta)}</span></span>
        <span class="run-open">Abrir ↗</span></a>`;
    }).join("");
    updateRunProg();
  }
  function updateRunProg(){
    const done = runIds.filter(id=>localStorage.getItem(bmKey(id))==="1").length;
    $("#run-prog").textContent = `${done} de ${runIds.length} abertas`;
  }
  function resetRunTicks(){ runIds.forEach(id=>localStorage.removeItem(bmKey(id))); renderRunList(); }
  function closeRun(){ $("#runmodal").hidden = true; }

  function start(){ $("#gate").hidden=true; load(); }

  // boot — só libera com login+senha (fica lembrado neste navegador até "Sair")
  if(!CFG.SUPABASE_URL || !KEY){
    $("#status").innerHTML = "<span class='dislike'>Configure o Supabase em config.js.</span>";
  } else if(localStorage.getItem(`gjs_${NS}_admin_ok`)==="1"){
    start();
  } else {
    $("#status").hidden=true; $("#gate").hidden=false;
    $("#gate-pass").addEventListener("keydown", e=>{ if(e.key==="Enter") checkLogin(); });
    $("#gate-user").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#gate-pass").focus(); });
  }
  </script>
</body>
</html>
